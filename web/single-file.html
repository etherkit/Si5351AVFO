<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Si5351AVFO Control</title>
  <style>
:root {
  color-scheme: dark;
  font-family: system-ui, sans-serif;
  background: #111418;
  color: #e6e6e6;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 1rem;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem;
  border-bottom: 1px solid #2a2f36;
  padding-bottom: 1rem;
  margin-bottom: 1rem;
}

h1 {
  font-size: 1.4rem;
  margin: 0;
}

h2 {
  font-size: 1.1rem;
  margin: 0 0 0.75rem;
}

#connection {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
  gap: 1rem;
}

section {
  background: #171b21;
  border: 1px solid #2a2f36;
  border-radius: 8px;
  padding: 1rem;
}

#unsupported {
  grid-column: 1 / -1;
  background: #3a1f1f;
  border-color: #7a3030;
}

label {
  display: block;
  margin-bottom: 0.75rem;
}

input,
select,
button {
  font: inherit;
  color: inherit;
  background: #0d1014;
  border: 1px solid #3a414b;
  border-radius: 6px;
  padding: 0.45rem 0.6rem;
}

input,
select {
  width: 100%;
  margin-top: 0.25rem;
}

input[aria-invalid="true"] {
  border-color: #c0392b;
}

button {
  cursor: pointer;
}

button:disabled,
input:disabled,
select:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

dl {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 0.35rem 1rem;
  margin: 0;
}

dt {
  color: #9aa4b2;
}

dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
}

#clock-controls {
  display: grid;
  gap: 0.75rem;
}

.clock-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 0.5rem;
  align-items: center;
  padding: 0.5rem;
  border: 1px solid #2a2f36;
  border-radius: 6px;
}

.memory-row {
  display: grid;
  grid-template-columns: 2rem minmax(0, 1fr) auto;
  gap: 0.5rem;
  align-items: center;
  padding: 0.4rem 0;
  border-bottom: 1px solid #23282f;
}

.memory-row > span:nth-child(3) {
  display: flex;
  gap: 0.2rem;
  flex-wrap: nowrap;
}

.memory-row:last-child {
  border-bottom: 0;
}

.memory-row button {
  padding: 0.2rem 0.35rem;
  font-size: 0.75rem;
}

#console-log {
  display: block;
  width: 100%;
  height: 12rem;
  overflow-y: auto;
  background: #0d1014;
  border: 1px solid #3a414b;
  border-radius: 6px;
  padding: 0.5rem;
  margin-bottom: 0.5rem;
  font-family: ui-monospace, monospace;
  font-size: 0.85rem;
  white-space: pre-wrap;
}

#console-form {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.5rem;
}

#console-form input {
  width: 100%;
  margin-top: 0;
}

#settings-panel button {
  margin-right: 0.5rem;
  margin-bottom: 0.5rem;
}

/* Hero: prominent frequency display */
#hero-panel {
  grid-column: 1 / -1;
  text-align: center;
}

#freq-display {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 0.4rem;
  margin: 0.5rem 0 1rem;
}

.freq-value {
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  line-height: 1;
}

.freq-unit {
  font-size: 1.25rem;
  color: #9aa4b2;
}

#tuning-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  margin: 0.75rem 0 1rem;
  flex-wrap: wrap;
}

#step-down,
#step-up {
  width: 3.25rem;
  height: 3.25rem;
  font-size: 1.6rem;
  line-height: 1;
  padding: 0;
  border-radius: 50%;
}

.knob {
  width: 7rem;
  height: 7rem;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #2a313a, #0d1014);
  border: 2px solid #3a414b;
  position: relative;
  cursor: grab;
  touch-action: none;
  user-select: none;
  display: grid;
  place-items: center;
}

.knob:active {
  cursor: grabbing;
}

.knob:focus-visible {
  outline: 2px solid #5b9cff;
  outline-offset: 3px;
}

.knob-indicator {
  position: absolute;
  top: 0.5rem;
  left: 50%;
  width: 4px;
  height: 1.1rem;
  margin-left: -2px;
  background: #5b9cff;
  border-radius: 2px;
  transform-origin: 50% 2.9rem;
  transition: transform 0.08s linear;
}

#tuning-step {
  display: flex;
  justify-content: center;
}

#tuning-step label {
  margin: 0;
  min-width: 12rem;
}

/* Secondary status strip */
#status-panel.secondary dl {
  grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
  gap: 0.25rem 1rem;
}

#status-panel.secondary dt {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

#status-panel.secondary dd {
  font-size: 0.95rem;
  font-weight: 600;
  text-align: right;
}

@media (max-width: 640px) {
  body {
    padding: 0.5rem;
  }

  .clock-row {
    grid-template-columns: 1fr 1fr;
  }

  .freq-value {
    font-size: clamp(2rem, 12vw, 3rem);
  }

  .knob {
    width: 5.5rem;
    height: 5.5rem;
  }
}

</style>
</head>
<body>
  <header>
    <h1>Si5351AVFO</h1>
    <div id="connection">
      <button id="connect">Connect</button>
      <button id="disconnect" hidden>Disconnect</button>
      <span id="port-info"></span>
      <span id="firmware-version"></span>
    </div>
  </header>

  <main>
    <section id="unsupported" hidden>
      This browser does not support Web Serial. Use Chrome or Edge on desktop.
    </section>

    <section id="hero-panel" class="hero">
      <div id="freq-display" aria-live="polite">
        <span id="status-freq" class="freq-value">—</span>
        <span class="freq-unit">Hz</span>
      </div>
      <div id="tuning-controls">
        <button id="step-down" type="button" aria-label="Step frequency down">−</button>
        <div id="tuning-knob" class="knob" role="slider" tabindex="0"
             aria-label="Tuning knob" aria-valuemin="8000" aria-valuemax="160000000"
             aria-valuenow="0" aria-valuetext="—">
          <span class="knob-indicator" aria-hidden="true"></span>
        </div>
        <button id="step-up" type="button" aria-label="Step frequency up">+</button>
      </div>
      <div id="tuning-step">
        <label>Step
          <select id="step">
            <option value="100000">100 kHz</option>
            <option value="10000">10 kHz</option>
            <option value="1000">1 kHz</option>
            <option value="500">500 Hz</option>
            <option value="100">100 Hz</option>
            <option value="10">10 Hz</option>
          </select>
        </label>
      </div>
    </section>

    <section id="status-panel" class="secondary">
      <h2>Status</h2>
      <dl>
        <dt>Band</dt><dd id="status-band">—</dd>
        <dt>Step</dt><dd id="status-step">—</dd>
        <dt>Mode</dt><dd id="status-mode">—</dd>
        <dt>Si5351</dt><dd id="status-si5351">—</dd>
        <dt>Outputs</dt><dd id="status-outputs" aria-live="polite">—</dd>
        <dt>Plan flags</dt><dd id="status-flags" aria-live="polite">—</dd>
      </dl>
    </section>

    <section id="tuning-panel">
      <h2>Tuning</h2>
      <label>Frequency (Hz)
        <input id="frequency" type="number" min="8000" max="160000000" step="1">
      </label>
      <label>Band
        <select id="band">
          <option>160M</option>
          <option>80M</option>
          <option>60M</option>
          <option>40M</option>
          <option>30M</option>
          <option>20M</option>
          <option>17M</option>
          <option>15M</option>
          <option>12M</option>
          <option>10M</option>
          <option>6M</option>
          <option>4M</option>
          <option>2M</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="DIR">Direct</option>
          <option value="SH">Superhet</option>
          <option value="IQ">Quadrature</option>
        </select>
      </label>
    </section>

    <section id="outputs-panel">
      <h2>Outputs</h2>
      <div id="clock-controls"></div>
    </section>

    <section id="superhet-panel">
      <h2>Superhet / quadrature</h2>
      <label>IF (Hz)
        <input id="if" type="number" min="8000" max="160000000" step="1">
      </label>
      <label>Injection
        <select id="injection">
          <option value="HI">High</option>
          <option value="LO">Low</option>
        </select>
      </label>
      <label>I/Q order
        <select id="iq-order">
          <option value="0">CLK0 = I</option>
          <option value="1">CLK1 = I</option>
        </select>
      </label>
      <label>Tuning limit
        <select id="limit">
          <option value="HAM">Amateur only</option>
          <option value="WIDE">Wide open</option>
        </select>
      </label>
    </section>

    <section id="memory-panel">
      <h2>Memories</h2>
      <div id="memory-list"></div>
    </section>

    <section id="settings-panel">
      <h2>Settings</h2>
      <label>Calibration (ppb)
        <input id="calibration" type="number" min="-999999" max="999999" step="1">
      </label>
      <button id="save">Save now</button>
      <button id="reset">Reset settings</button>
      <button id="factory-reset">Factory reset</button>
    </section>

    <section id="console-panel">
      <h2>Console</h2>
      <output id="console-log"></output>
      <form id="console-form">
        <input id="console-input" placeholder="STATUS">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
